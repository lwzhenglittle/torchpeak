[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "torchpeak"
version = "0.1.0"
description = "Cross-stack PyTorch benchmark: operator and model throughput, bandwidth, and eager-vs-compile A/B, normalized to hardware peak rates."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "lwzhenglittle" }]
requires-python = ">=3.9"
dependencies = ["torch>=2.4"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/lwzhenglittle/torchpeak"
"Bug Tracker" = "https://github.com/lwzhenglittle/torchpeak/issues"

[project.optional-dependencies]
models = ["torchvision", "transformers"]

[project.scripts]
torchpeak = "torchpeak.cli:main"

[tool.setuptools]
packages = ["torchpeak"]

[tool.setuptools.package-data]
torchpeak = ["peaks.json", "locales/*.json"]
